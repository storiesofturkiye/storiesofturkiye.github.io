<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stories of Türkiye — Books</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #faf7f2;
    font-family: 'DM Sans', sans-serif;
    color: #2c2218;
  }

  .books-section {
    padding: 64px 24px 80px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .books-section h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 44px);
    text-align: center;
    color: #2c2218;
    margin-bottom: 8px;
  }

  .books-section .subtitle {
    text-align: center;
    color: #8a7560;
    font-size: 15px;
    margin-bottom: 48px;
  }

  /* Search */
  .search-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 40px;
  }

  .search-wrap input {
    width: 100%;
    max-width: 420px;
    padding: 12px 20px;
    border: 1.5px solid #d9cfc4;
    border-radius: 40px;
    background: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: #2c2218;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: #b9935d; }
  .search-wrap input::placeholder { color: #b0a090; }

  /* Grid */
  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 24px;
  }

  /* Card */
  .book-card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(44, 34, 24, 0.07);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
  }

  .book-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(44, 34, 24, 0.14);
  }

  .book-card:hover .card-title { color: #b9935d; }

  .card-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: #f0ebe3;
  }

  .card-body {
    padding: 12px 14px 14px;
    flex: 1;
    display: flex;
    align-items: flex-start;
  }

  .card-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    color: #2c2218;
    transition: color 0.2s;
  }

  /* Empty state */
  .no-results {
    display: none;
    grid-column: 1/-1;
    text-align: center;
    color: #8a7560;
    font-size: 15px;
    padding: 40px 0;
  }

  @media (max-width: 480px) {
    .books-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
  }
</style>
</head>
<body>

<section class="books-section">
  <h2>Books</h2>
  <p class="subtitle">53 audiobooks exploring the culture, history, and landscapes of Türkiye</p>

  <div class="search-wrap">
    <input type="search" id="book-search" placeholder="Search books…" autocomplete="off">
  </div>

  <div class="books-grid" id="books-grid">
    <!-- Cards injected by JS -->
    <p class="no-results" id="no-results">No books found.</p>
  </div>
</section>

];
const grid = document.getElementById('books-grid');
const noResults = document.getElementById('no-results');
const searchInput = document.getElementById('book-search');

function renderCards(list) {
  // Remove old cards (keep no-results)
  Array.from(grid.children).forEach(el => {
    if (el !== noResults) el.remove();
  });
  if (list.length === 0) {
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';
  list.forEach(b => {
    const a = document.createElement('a');
    a.className = 'book-card';
    a.href = b.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = `
      <img class="card-img" src="${b.img}" alt="${b.title}" loading="lazy">
      <div class="card-body"><p class="card-title">${b.title}</p></div>
    `;
    grid.insertBefore(a, noResults);
  });
}

renderCards(books);

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  renderCards(q ? books.filter(b => b.title.toLowerCase().includes(q)) : books);
});
</script>
