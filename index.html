<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stories of Türkiye — Karamel's Books</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #faf7f2;
    font-family: 'DM Sans', sans-serif;
    color: #2c2218;
  }

  .books-section {
    padding: 64px 24px 80px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .books-section h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 44px);
    text-align: center;
    color: #2c2218;
    margin-bottom: 8px;
  }

  .books-section .subtitle {
    text-align: center;
    color: #8a7560;
    font-size: 15px;
    margin-bottom: 32px;
  }

  /* Language Selector Styling */
  .language-wrap {
    text-align: center;
    margin-bottom: 24px;
  }

  .language-wrap label {
    font-size: 14px;
    font-weight: 500;
    margin-right: 8px;
  }

  #language-select {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1.5px solid #d9cfc4;
    background: #fff;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    cursor: pointer;
  }

  /* Search */
  .search-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 40px;
  }

  .search-wrap input {
    width: 100%;
    max-width: 420px;
    padding: 12px 20px;
    border: 1.5px solid #d9cfc4;
    border-radius: 40px;
    background: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: #2c2218;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: #b9935d; }
  .search-wrap input::placeholder { color: #b0a090; }

  /* Grid */
  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 24px;
  }

  /* Card */
  .book-card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(44, 34, 24, 0.07);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
  }

  .book-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(44, 34, 24, 0.14);
  }

  .book-card:hover .card-title { color: #b9935d; }

  .card-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: #f0ebe3;
  }

  .card-body {
    padding: 12px 14px 14px;
    flex: 1;
    display: flex;
    align-items: flex-start;
  }

  .card-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    color: #2c2218;
    transition: color 0.2s;
  }

  /* Empty state */
  .no-results {
    display: none;
    grid-column: 1/-1;
    text-align: center;
    color: #8a7560;
    font-size: 15px;
    padding: 40px 0;
  }

  @media (max-width: 480px) {
    .books-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
  }
</style>
</head>
<body>

<section class="books-section">
  <h2>Karamel's Books</h2>
  <p class="subtitle">53 audiobooks exploring the culture, history, and landscapes of Türkiye</p>

  <div class="language-wrap">
    <label for="language-select"><b>Select Language:</b></label>
    <select id="language-select">
      <option value="Albanian">Albanian</option>
      <option value="Arabic">Arabic</option>
      <option value="Azerbaijani">Azerbaijani</option>
      <option value="Belarusian">Belarusian</option>
      <option value="Bosnian">Bosnian</option>
      <option value="Bulgarian">Bulgarian</option>
      <option value="Chinese">Chinese</option>
      <option value="Danish">Danish</option>
      <option value="Dutch">Dutch</option>
      <option selected value="English">English</option>
      <option value="Farsi">Farsi</option>
      <option value="French">French</option>
      <option value="Georgian">Georgian</option>
      <option value="German">German</option>
      <option value="Hungarian">Hungarian</option>
      <option value="Italian">Italian</option>
      <option value="Kazakh">Kazakh</option>
      <option value="Korean">Korean</option>
      <option value="Kyrgyz">Kyrgyz</option>
      <option value="Macedonian">Macedonian</option>
      <option value="Malay">Malay</option>
      <option value="Montenegrin">Montenegrin</option>
      <option value="Pashto">Pashto</option>
      <option value="Polish">Polish</option>
      <option value="Romanian">Romanian</option>
      <option value="Russian">Russian</option>
      <option value="Serbian">Serbian</option>
      <option value="Spanish">Spanish</option>
      <option value="Swedish">Swedish</option>
      <option value="Turkish">Turkish</option>
      <option value="Turkmen">Turkmen</option>
      <option value="Ukrainian">Ukrainian</option>
      <option value="Urdu">Urdu</option>
      <option value="Uzbek">Uzbek</option>
    </select>
  </div>

  <div class="search-wrap">
    <input type="search" id="book-search" placeholder="Search books…" autocomplete="off">
  </div>

  <div class="books-grid" id="books-grid">
    <p class="no-results" id="no-results">No books found.</p>
  </div>
</section>

<script>
// Kitap listesi (ID bazlı yapıya uygun hale getirildi)
const booksData = [
  {id: 1, title: 'The Flavors of Türkiye'},
  {id: 2, title: 'Turkish Musical Instruments'},
  {id: 3, title: 'Turkish Holidays and Festivals'},
  {id: 4, title: 'The Enchanting Landscapes of Türkiye'},
  {id: 5, title: 'Turkish Folklore and Mythology'},
  {id: 6, title: 'Turkish Handcrafts'},
  {id: 7, title: 'Turkish History'},
  {id: 8, title: 'Turkish Sports and Games'},
  {id: 9, title: 'Turkish Flora and Fauna'},
  {id: 10, title: 'Turkish Historical and Architectural Landmarks'},
  {id: 11, title: 'Adventures with Turkish Folk Heroes'},
  {id: 12, title: 'Turkish Traditional Clothing'},
  {id: 13, title: 'Turkish Natural Life'},
  {id: 14, title: 'Turkish Music Culture'},
  {id: 15, title: 'Turkish Athletes and Their Success'},
  {id: 16, title: 'Turkish Traditional Arts'},
  {id: 17, title: 'Turkish History and Important Figures'},
  {id: 18, title: 'Legendary History of Anatolia'},
  {id: 19, title: 'Turkish Playgrounds for Kids'},
  {id: 20, title: 'Turkish Culinary Adventure'},
  {id: 21, title: 'Türkiye in Winter'},
  {id: 22, title: 'Türkiye in Fall'},
  {id: 23, title: 'Türkiye in Summer'},
  {id: 24, title: 'Türkiye in Spring'},
  {id: 25, title: 'Exploring Istanbul Seven Hills'},
  {id: 26, title: 'Exploring Aegean Region'},
  {id: 27, title: 'Exploring Mediterranean Region'},
  {id: 28, title: 'Exploring Marmara Region'},
  {id: 29, title: 'Exploring Central Anatolia Region'},
  {id: 30, title: 'Exploring Black Sea Region'},
  {id: 31, title: 'Exploring Eastern Anatolia Region'},
  {id: 32, title: 'Exploring Southeastern Anatolia'},
  {id: 33, title: 'The Music and Dance of Türkiye'},
  {id: 34, title: 'Animal Adventures in Türkiye'},
  {id: 35, title: "Karamel and Türkiye's Treasures"},
  {id: 36, title: 'The Amazing Scientific Discoveries in Türkiye'},
  {id: 37, title: 'The World-Changing Events in Türkiye'},
  {id: 38, title: 'The Ancient Kingdoms of Türkiye'},
  {id: 39, title: 'The Four Seasons in Türkiye'},
  {id: 40, title: 'The Seven Wonders of Türkiye'},
  {id: 41, title: 'The Magic of Turkish Markets'},
  {id: 42, title: 'Visiting Turkish Families'},
  {id: 43, title: 'The Family Cultures of Türkiye'},
  {id: 44, title: 'The Eco-Friendly Journey Across Türkiye'},
  {id: 45, title: 'Exploration of Turkish Literature'},
  {id: 46, title: 'Turkish Mythology'},
  {id: 47, title: 'The Hidden Gems of Türkiye'},
  {id: 48, title: 'The Evolution of Turkish Art'},
  {id: 49, title: 'The Magical Gardens of Türkiye'},
  {id: 50, title: 'The Mystical Caves of Türkiye'},
  {id: 51, title: 'The Famous Bridges of Türkiye'},
  {id: 52, title: 'Turkish Maritime History'},
  {id: 53, title: 'Traditional Turkish Village Life'},
];

const grid = document.getElementById('books-grid');
const noResults = document.getElementById('no-results');
const searchInput = document.getElementById('book-search');
const languageSelect = document.getElementById('language-select');

function renderCards() {
  const query = searchInput.value.trim().toLowerCase();
  const selectedLang = languageSelect.value;

  // Mevcut kartları temizle
  Array.from(grid.children).forEach(el => {
    if (el !== noResults) el.remove();
  });

  const filteredBooks = booksData.filter(b => b.title.toLowerCase().includes(query));

  if (filteredBooks.length === 0) {
    noResults.style.display = 'block';
    return;
  }

  noResults.style.display = 'none';
  
  filteredBooks.forEach(b => {
    const a = document.createElement('a');
    a.className = 'book-card';
    // Link ve resim yapısı dile göre dinamik oluşturuluyor
    a.href = `./web/${selectedLang}/${b.id}/index.html`;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = `
      <img class="card-img" src="./imgs/${b.id}.jpg" alt="${b.title}" loading="lazy">
      <div class="card-body"><p class="card-title">${b.title}</p></div>
    `;
    grid.insertBefore(a, noResults);
  });
}

// Event Listeners
searchInput.addEventListener('input', renderCards);
languageSelect.addEventListener('change', renderCards);

// İlk yükleme
renderCards();
</script>

</body>
</html>
